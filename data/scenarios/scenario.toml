# Apeiron scenario — Inner solar system
#
# Kernel load order: LSK first, then PCK, then SPK.

[[kernels]]
path = "../kernels/lsk/naif0012.tls"

[[kernels]]
path = "../kernels/pck/pck00011.tpc"

[[kernels]]
path = "../kernels/spk/de440s.bsp"

[[kernels]]
path = "../kernels/spk/mar099s.bsp"

# ---------------------------------------------------------------------------

[observer]
body   = "EARTH"
target = "SUN"
frame  = "ECLIPJ2000"

[time]
# First quarter moon — Moon is ~90° from Sun, visible to the right of Earth.
epoch  = "2025-07-03T12:00:00"

# ---------------------------------------------------------------------------

[[bodies]]
naif  = "SUN"
color = [1.0, 0.92, 0.23]
# diffuse = "textures/sun.jpg"

[[bodies]]
naif  = "EARTH"
color = [1.0, 1.0, 1.0]   # tint is white so texture shows unmodified
diffuse = "../textures/earth/8k_earth_daymap.jpg"
specular = "../textures/earth/8k_earth_specular_map.jpg"
normals = "../textures/earth/8k_earth_normal_map.jpg"
clouds = "../textures/earth/8k_earth_clouds.jpg"


[[bodies]]
naif  = "MOON"
color = [1.0, 1.0, 1.0]
diffuse = "../textures/moon/moon-4k.png"
normals = "../textures/moon/moon_normal.jpg"

[[bodies]]
naif  = "MARS"
color = [1.0, 1.0, 1.0]
diffuse = "../textures/mars/8k_mars.jpg"

[[bodies]]
naif  = "PHOBOS"
color = [1.0, 1.0, 1.0]
# diffuse = "../textures/phobos/phobos.jpg"

[[bodies]]
naif  = "DEIMOS"
color = [1.0, 1.0, 1.0]
# diffuse = "../textures/deimos/deimos.jpg"
