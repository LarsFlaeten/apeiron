# ---------------------------------------------------------------------------
# Spacecraft — listed in load order.
# config: path relative to this file's directory.
# player: true for the user-controlled craft (exactly one per scenario).
# ---------------------------------------------------------------------------

[[spacecraft]]
config = "../spacecraft/orion/orion.toml"
player = true
orbit.central_body = "EARTH"
orbit.epoch        = "2026-03-29T03:11:03"
orbit.inclination  = 51.6344
orbit.raan         = 336.2407
orbit.eccentricity = 0.0006215
orbit.arg_perigee  = 245.2164
orbit.mean_anomaly = 114.8157   # 0.0021° behind ISS ≈ 250 m at 400 km alt
orbit.mean_motion  = 15.48624340

